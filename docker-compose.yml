services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: crafts-backend
    restart: unless-stopped
    environment:
      - PORT=4173
      - ADMIN_KEY=cashmere-admin-test
      - NODE_ENV=production
      - ALLOWED_ORIGINS=*
    volumes:
      - ./backend/data:/app/data
      - ./backend/uploads:/app/uploads
    expose:
      - "4173"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: crafts-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

